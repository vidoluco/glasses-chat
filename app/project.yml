name: HeyChat
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.2"
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
packages:
  MWDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.0.1
targets:
  HeyChat:
    type: application
    platform: iOS
    sources: [HeyChat]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.heychat
        INFOPLIST_FILE: HeyChat/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: HeyChat/HeyChat.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        META_APP_ID: "0"
    dependencies:
      - package: MWDAT
        product: MWDATCore
      - package: MWDAT
        product: MWDATCamera
