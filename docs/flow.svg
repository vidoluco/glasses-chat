<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 260" width="1280" height="260" role="img" aria-label="The glasses send a photo and a question on WhatsApp. Meta delivers them to a relay on Cloudflare Workers. A bridge on your Mac pulls from the relay, asks Codex on your ChatGPT plan, and replies on WhatsApp, where the glasses read the answer aloud. The Mac accepts no inbound connection.">
<title>glasses-chat pipeline</title>
<style>
  .mono{font-family:ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="1280" height="260" fill="#0F0D0C"/>
<text class="mono" x="64" y="44" fill="#8A837A" font-size="15" letter-spacing="2.5">GLASSES-CHAT · ~7 S PER ANSWER</text>
<text class="mono" x="1216" y="44" text-anchor="end" fill="#8A837A" font-size="15" letter-spacing="2.5">THE MAC NEVER ACCEPTS A CONNECTION</text>

<path d="M222 122 H303" fill="none" stroke="#2A2522" stroke-width="2" stroke-dasharray="5 6"><animate attributeName="stroke-dashoffset" from="0" to="-22" dur="0.9s" repeatCount="indefinite"/></path>
<path d="M499 122 H542" fill="none" stroke="#2A2522" stroke-width="2" stroke-dasharray="5 6"><animate attributeName="stroke-dashoffset" from="0" to="-22" dur="0.9s" repeatCount="indefinite"/></path>
<path d="M781 122 H738" fill="none" stroke="#E5322D" stroke-width="2" stroke-dasharray="5 6" stroke-opacity=".8"><animate attributeName="stroke-dashoffset" from="0" to="-22" dur="0.9s" repeatCount="indefinite"/></path>
<path d="M977 122 H1020" fill="none" stroke="#2A2522" stroke-width="2" stroke-dasharray="5 6"><animate attributeName="stroke-dashoffset" from="0" to="-22" dur="0.9s" repeatCount="indefinite"/></path>
<path d="M879 82 C879 40 401 40 401 82" fill="none" stroke="#8A837A" stroke-width="1.5" stroke-dasharray="5 6" stroke-opacity=".7"><animate attributeName="stroke-dashoffset" from="0" to="-22" dur="1.2s" repeatCount="indefinite"/></path>
<text class="mono" x="760" y="108" text-anchor="middle" fill="#E5322D" font-size="12" letter-spacing="1.5">PULL</text>
<text class="mono" x="640" y="74" text-anchor="middle" fill="#8A837A" font-size="12" letter-spacing="1.5">REPLY · GRAPH API</text>

<rect x="102" y="82" width="120" height="80" rx="14" fill="#1C1917" stroke="#2A2522" stroke-width="2"/>
<g fill="none" stroke="#F3ECE2" stroke-width="3"><circle cx="140" cy="118" r="14"/><circle cx="184" cy="118" r="14"/><path d="M154 116 h16"/></g>
<text class="mono" x="162" y="152" text-anchor="middle" fill="#8A837A" font-size="12">photo + ask</text>
<text class="mono" x="162" y="192" text-anchor="middle" fill="#8A837A" font-size="14" letter-spacing="2.5">RAY-BAN META</text>

<rect x="303" y="82" width="196" height="80" rx="12" fill="#161311" stroke="#2A2522" stroke-width="1.5"/>
<text class="mono" x="401" y="118" text-anchor="middle" fill="#F3ECE2" font-size="24" font-weight="700">whatsapp</text>
<text class="mono" x="401" y="145" text-anchor="middle" fill="#8A837A" font-size="14">cloud api webhook</text>
<text class="mono" x="401" y="192" text-anchor="middle" fill="#8A837A" font-size="14" letter-spacing="2.5">META</text>

<rect x="542" y="82" width="196" height="80" rx="12" fill="#161311" stroke="#2A2522" stroke-width="1.5"/>
<text class="mono" x="640" y="118" text-anchor="middle" fill="#F3ECE2" font-size="24" font-weight="700">relay</text>
<text class="mono" x="640" y="145" text-anchor="middle" fill="#8A837A" font-size="14">signed · one sender</text>
<text class="mono" x="640" y="192" text-anchor="middle" fill="#8A837A" font-size="14" letter-spacing="2.5">CLOUDFLARE FREE</text>

<rect x="781" y="82" width="196" height="80" rx="12" fill="#161311" stroke="#E5322D" stroke-width="1.5"/>
<text class="mono" x="879" y="118" text-anchor="middle" fill="#F3ECE2" font-size="24" font-weight="700">bridge.py</text>
<text class="mono" x="879" y="145" text-anchor="middle" fill="#8A837A" font-size="14">pairs photo + text</text>
<text class="mono" x="879" y="192" text-anchor="middle" fill="#5E8F5A" font-size="14" letter-spacing="2.5">YOUR MAC</text>

<rect x="1020" y="82" width="196" height="80" rx="12" fill="#161311" stroke="#2A2522" stroke-width="1.5"/>
<text class="mono" x="1118" y="118" text-anchor="middle" fill="#F3ECE2" font-size="24" font-weight="700">codex exec</text>
<text class="mono" x="1118" y="145" text-anchor="middle" fill="#8A837A" font-size="14">your chatgpt plan</text>
<text class="mono" x="1118" y="192" text-anchor="middle" fill="#8A837A" font-size="14" letter-spacing="2.5">NO API KEY</text>

<circle r="4.5" fill="#E5322D"><animateMotion dur="4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".4 0 .2 1" path="M 222 122 H 542"/></circle>
<circle r="4.5" fill="#E5322D"><animateMotion dur="4s" begin="1.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".4 0 .2 1" path="M 738 122 H 781"/></circle>
<circle r="3.5" fill="#8A837A"><animateMotion dur="4s" begin="2.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".4 0 .2 1" path="M879 82 C879 40 401 40 401 82"/></circle>
<text class="mono" x="64" y="236" fill="#3A3430" font-size="13" letter-spacing="2.5">NO APP ON THE PHONE · NO PORT OPEN ON THE MAC</text>
</svg>
