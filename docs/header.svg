<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480" role="img" aria-label="glasses-chat. Ask your Ray-Ban Meta glasses about what you are looking at: the photo and the question go to a WhatsApp contact, a bridge on your Mac answers, and the glasses read the answer aloud.">
<title>glasses-chat</title>
<style>
  .mono{font-family:ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;}
  .serif{font-family:"Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.15}}
  .live{animation:pulse 1.4s ease-in-out infinite}
  @keyframes ring{0%{r:6;opacity:.9}100%{r:18;opacity:0}}
  .ring{animation:ring 1.4s ease-out infinite}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  .cursor{animation:blink 1.1s steps(1) infinite}
  @keyframes fadein{from{fill-opacity:0}to{fill-opacity:1}}
  .l{fill-opacity:0;animation:fadein .7s ease-out forwards}
  @keyframes scan{from{transform:translateY(-4px)}to{transform:translateY(484px)}}
  .scan{animation:scan 9s linear infinite}
  @keyframes flash{0%,8%,100%{opacity:0}2%{opacity:.85}}
  .flash{animation:flash 6s ease-out infinite}
  @keyframes bubble{0%,100%{opacity:0;transform:translateY(6px)}6%,90%{opacity:1;transform:translateY(0)}}
  .b1{opacity:0;animation:bubble 6s ease-out infinite;animation-delay:.6s}
  .b2{opacity:0;animation:bubble 6s ease-out infinite;animation-delay:1.6s}
  .b3{opacity:0;animation:bubble 6s ease-out infinite;animation-delay:3.2s}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}.b1,.b2,.b3{opacity:1}}
</style>
<rect width="1280" height="480" fill="#0F0D0C"/>
<defs>
  <clipPath id="type"><rect x="86" y="228" width="0" height="34"><animate attributeName="width" from="0" to="1000" begin="1.1s" dur="3.4s" calcMode="linear" fill="freeze"/></rect></clipPath>
  <clipPath id="view"><rect x="80" y="306" width="400" height="102" rx="4"/></clipPath>
  <linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3ECE2" stop-opacity="0"/><stop offset="1" stop-color="#F3ECE2" stop-opacity=".08"/></linearGradient>
</defs>
<rect class="scan" x="0" y="0" width="1280" height="4" fill="url(#scanG)"/>
<g stroke="#2A2522" stroke-width="2" fill="none"><path d="M28 60 V28 H60"/><path d="M1252 60 V28 H1220"/><path d="M28 420 V452 H60"/><path d="M1252 420 V452 H1220"/></g>

<g class="mono" font-size="17" letter-spacing="2">
  <circle class="ring" cx="76" cy="55" r="6" fill="none" stroke="#E5322D" stroke-width="1.5"/>
  <circle class="live" cx="76" cy="55" r="6" fill="#E5322D"/>
  <text x="94" y="61" fill="#E5322D" font-weight="700">LIVE</text>
  <text x="160" y="61" fill="#8A837A">WHATSAPP · CLOUDFLARE · YOUR MAC</text>
</g>
<text class="mono" x="1216" y="61" text-anchor="end" font-size="16" letter-spacing="1.5" fill="#8A837A">"HEY META, SEND IT TO TONY"</text>

<text class="serif" x="62" y="196" fill="#F3ECE2" font-size="104" letter-spacing="-2"><tspan class="l" style="animation-delay:0.15s">g</tspan><tspan class="l" style="animation-delay:0.20s">l</tspan><tspan class="l" style="animation-delay:0.25s">a</tspan><tspan class="l" style="animation-delay:0.30s">s</tspan><tspan class="l" style="animation-delay:0.35s">s</tspan><tspan class="l" style="animation-delay:0.40s">e</tspan><tspan class="l" style="animation-delay:0.45s">s</tspan><tspan class="l" style="animation-delay:0.50s" fill="#E5322D">-</tspan><tspan class="l" style="animation-delay:0.55s">c</tspan><tspan class="l" style="animation-delay:0.60s">h</tspan><tspan class="l" style="animation-delay:0.65s">a</tspan><tspan class="l" style="animation-delay:0.70s">t</tspan></text>
<g class="mono" font-size="22"><text x="66" y="254" fill="#E5322D">$</text><text x="90" y="254" fill="#8A837A" clip-path="url(#type)">look at it, ask out loud, hear the answer. phone stays in your pocket.<tspan class="cursor" fill="#F3ECE2">▍</tspan></text></g>

<text class="mono" x="64" y="286" fill="#3A3430" font-size="13" letter-spacing="2.5">GLASSES CAMERA · 12 MP</text>
<rect x="64" y="292" width="432" height="150" rx="10" fill="#161311" stroke="#2A2522" stroke-width="1.5"/>
<rect x="80" y="306" width="400" height="102" rx="4" fill="#0B0A09"/>
<g clip-path="url(#view)">
  <rect x="80" y="380" width="400" height="28" fill="#1C1917"/>
  <path d="M262 380 l-10 -26 h56 l-10 26 z" fill="#3A3430"/>
  <path d="M280 354 C 262 330 250 322 236 326 C 252 336 262 344 276 354 Z" fill="#5E8F5A"/>
  <path d="M280 354 C 290 322 304 312 322 312 C 312 328 300 342 284 354 Z" fill="#5E8F5A" opacity=".85"/>
  <path d="M280 354 C 276 328 280 318 284 310 C 290 324 288 340 282 354 Z" fill="#5E8F5A" opacity=".7"/>
  <g stroke="#8A837A" stroke-width="1.5" fill="none" opacity=".7"><path d="M210 318 v-8 h8"/><path d="M350 318 v-8 h-8"/><path d="M210 364 v8 h8"/><path d="M350 364 v8 h-8"/></g>
  <rect class="flash" x="80" y="306" width="400" height="102" fill="#F3ECE2"/>
</g>
<g class="mono" font-size="12" letter-spacing="1.5" fill="#8A837A"><text x="80" y="430">IMG_0042.jpg · SENT TO TONY</text></g>
<circle class="live" cx="466" cy="320" r="5" fill="#E5322D"/>

<text class="mono" x="536" y="286" fill="#3A3430" font-size="13" letter-spacing="2.5">WHATSAPP · READ ALOUD BY THE GLASSES</text>
<g class="mono" font-size="15">
  <g class="b1"><rect x="896" y="296" width="320" height="34" rx="10" fill="#1F2A1E" stroke="#2A2522"/><text x="914" y="318" fill="#F3ECE2">[photo]</text><text x="1200" y="318" text-anchor="end" fill="#5E8F5A" font-size="12">you</text></g>
  <g class="b2"><rect x="856" y="340" width="360" height="34" rx="10" fill="#1F2A1E" stroke="#2A2522"/><text x="874" y="362" fill="#F3ECE2">what plant is this?</text><text x="1200" y="362" text-anchor="end" fill="#5E8F5A" font-size="12">you</text></g>
  <g class="b3"><rect x="536" y="384" width="560" height="54" rx="10" fill="#161311" stroke="#2A2522"/><text x="554" y="406" fill="#F3ECE2">Looks like a Ficus elastica, the rubber plant:</text><text x="554" y="426" fill="#F3ECE2">large, thick, glossy oval leaves.</text><text x="1080" y="426" text-anchor="end" fill="#E5322D" font-size="12">tony · 6.8 s</text></g>
</g>
</svg>
